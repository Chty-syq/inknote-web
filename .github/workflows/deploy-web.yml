name: Build Web From InkNote Content

on:
  push:
    branches:
      - content
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: inknote-web-pages
  cancel-in-progress: true

env:
  INKNOTE_SOURCE_REPOSITORY: ${{ vars.INKNOTE_SOURCE_REPOSITORY || 'Chty-syq/InkNote' }}
  INKNOTE_SOURCE_REF: ${{ vars.INKNOTE_SOURCE_REF || 'master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: content-source

      - name: Checkout web shell source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INKNOTE_SOURCE_REPOSITORY }}
          ref: ${{ env.INKNOTE_SOURCE_REF }}
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare content
        shell: bash
        run: |
          rm -rf source/content source/apps/web/public
          mkdir -p source/apps/web
          cp -a content-source/content source/content
          if [ -d content-source/apps/web/public ]; then
            cp -a content-source/apps/web/public source/apps/web/public
          else
            mkdir -p source/apps/web/public
          fi

      - name: Resolve Pages base
        id: pages-base
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          repo_name_lower="$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')"
          owner_site="$(echo "${GITHUB_REPOSITORY_OWNER}.github.io" | tr '[:upper:]' '[:lower:]')"
          if [ "$repo_name_lower" = "$owner_site" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$repo_name/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build web
        working-directory: source
        run: npm run web:build
        env:
          VITE_PAGES_BASE: ${{ steps.pages-base.outputs.base }}

      - name: Prepare SPA fallback
        shell: bash
        run: |
          cp source/apps/web/dist/index.html source/apps/web/dist/404.html
          touch source/apps/web/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
